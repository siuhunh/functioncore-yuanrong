syntax = "proto3";

package common;

option go_package = "./common";

message CallRequest {
    // The native event from user
    bytes event = 1;
    // "state" can be null
    State state = 2;
    string property = 4;
}

message CallResult {
    bytes result = 1;
    // "state" can be null
    State state = 2;
    string property = 4;
}

message State {
    // State id
    string id = 1;
    // State content
    string content = 2;
}
