apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app: fluent-bit-logging
spec:
  selector:
    matchLabels:
      app: fluent-bit-logging
  template:
    metadata:
      labels:
        app: fluent-bit-logging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2020"
        prometheus.io/path: /api/v1/metrics/prometheus
    spec:
      containers:
      - command:
        - /fluent-bit/bin/fluent-bit
        - -c
        - /fluent-bit/etc/fluent-bit.conf
        image: docker-hub.tools.huawei.com/sn-solution/fluent/fluent-bit:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 2020
        name: fluent-bit
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/sn/log
          name: varlog
        - mountPath: /home/snuser/log
          name: runtimelog
        - mountPath: /var/log/containers
          name: consolelog
        - mountPath: /var/log/pods
          name: podslog
        - mountPath: /home/disk/docker/containers
          name: containerslog
        - mountPath: /fluent-bit/etc
          name: fluent-bit-component-config
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: default-secret
      volumes:
      - configMap:
          defaultMode: 420
          name: fluent-bit-component-config
        name: fluent-bit-component-config
      - name: varlog
        hostPath:
          path: /var/paas/sys/log/cff/default/
      - name: runtimelog
        hostPath:
          path: /var/paas/sys/log/cff/default/
      - name: consolelog
        hostPath:
          path: /var/log/containers
      - name: podslog
        hostPath:
          path: /var/log/pods
      - name: containerslog
        hostPath:
          path: /home/disk/docker/containers

