syntax = "proto3";

package filter;

option go_package = "api/filter";

option java_package = "com.huawei.sn.msgstruct";
option java_outer_classname = "Filter";

message CreateOptions{
    int64 cpu = 1;
    int64 memory = 2;
}

message RequestPb {
    string key = 1;
    string funcName = 2;
    string stateID = 3;
    string podName = 4;
    string creator = 5;
    CreateOptions options = 6;
    string clientFuncName = 7;
    string clientVersion = 8;
    string clientTenantID = 9;
}

message ResponsePb {
    int32 code = 1;
    string message = 2;
    string stateID = 3;
    string stateKey = 4;
}
