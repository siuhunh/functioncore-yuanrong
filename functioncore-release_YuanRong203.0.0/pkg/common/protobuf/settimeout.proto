syntax = "proto3";

package settimeout;

option go_package = "api/settimeout";

option java_package = "com.huawei.sn.msgstruct";
option java_outer_classname = "SetTimeout";

message RequestPb {
    string stateID = 1;
    string futureID = 2;
    int32 timeout = 3;
    int32 countOfFuncName = 4;
}

message ResponsePb {
    int32 code = 1;
    string message = 2;
    string futureID = 3;
}
