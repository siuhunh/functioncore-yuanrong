apiVersion: v1
kind: Service
metadata:
  name: local-cache-service
  namespace: default
spec:
  ports:
    - name: port
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    app: local-cache-service
  sessionAffinity: None
  type: ClusterIP