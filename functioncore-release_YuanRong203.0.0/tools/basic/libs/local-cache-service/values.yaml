image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.19.1-alpine
  pullPolicy: IfNotPresent

params:
  ADDR: minio:9000

securityContext:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

resources:
  limits:
    cpu: "4"
    ephemeral-storage: 6Gi
    memory: 4Gi
  requests:
    cpu: "2"
    ephemeral-storage: 6Gi
    memory: 2Gi

namespaceOverride: "default"

imagePullSecrets:
  - name: default-secret
